version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly

  # Every action is SHA-pinned; this is what keeps the pins current rather than
  # frozen. A pin nobody updates is a supply-chain risk wearing a safety label.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
