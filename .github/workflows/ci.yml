name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege by default. No job here needs to write anything; the deploy
# workflow asks for `id-token: write` on its own.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.11.14"

jobs:
  # Runs first and alone, so an invariant breach is unambiguous in the log
  # rather than buried in a hundred unit-test lines. Inherited from the
  # predecessor's CI, which got this right.
  structural:
    name: Structural invariants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run pytest tests/test_structural.py -v

  # The predecessor died cross-platform. Test cross-platform.
  test:
    name: Tests (${{ matrix.os }})
    needs: structural
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run pytest

      # Guard against the predecessor's failure #4: a console script the docs
      # assume and nobody installed. Both entry points must exist and agree.
      - name: Entry points agree
        shell: bash
        run: |
          a="$(uv run dsar --version)"
          b="$(uv run python -m dsar --version)"
          echo "console script: $a"
          echo "python -m dsar: $b"
          [ "$a" = "$b" ] || { echo "entry points disagree"; exit 1; }

      - name: Doctor runs offline
        shell: bash
        env:
          DSAR_CLIENT_ID: 00000000-0000-0000-0000-000000000001
          DSAR_TENANT_ID: 00000000-0000-0000-0000-000000000002
        run: uv run dsar doctor --offline

      # The front end has no build step, which is deliberate — and it means a
      # syntax error there is served as happily as working code, passes every
      # test in the suite, and fails only in the browser with the page half
      # rendered. Node is preinstalled on every hosted runner and used for
      # nothing else here; this is the parser, not a toolchain.
      #
      # Deliberately duplicates test_the_front_end_parses, which skips when
      # node is absent. This step is what stops the guarantee being a skip
      # nobody reads. A duplicated assertion is how CI went red for four
      # commits unnoticed once, so: same command, no second copy of any logic.
      - name: Front end parses
        shell: bash
        run: node --check src/dsar/web/static/app.js

  typecheck:
    name: mypy --strict
    needs: structural
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run mypy

  # A stale lock re-resolves per machine, which is the exact class of failure
  # this project exists to eliminate. Fail loudly instead.
  lock:
    name: Lockfile is current
    needs: structural
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv lock --check

  container:
    name: Container smoke test
    needs: structural
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      # arm64 is not optional — Apple Silicon is where the predecessor's demo
      # failed. Build both, load amd64 for the smoke test.
      - name: Build (multi-arch)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          tags: dsar-assist:ci

      - name: Build (load for smoke test)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          load: true
          tags: dsar-assist:ci

      - name: Entry point is the installed console script
        run: |
          docker run --rm dsar-assist:ci --version
          docker run --rm --entrypoint python dsar-assist:ci -m dsar --version
          a="$(docker run --rm dsar-assist:ci --version)"
          b="$(docker run --rm --entrypoint python dsar-assist:ci -m dsar --version)"
          [ "$a" = "$b" ] || { echo "entry points disagree in the image"; exit 1; }

      # Asked of the interpreter rather than of `id`, because the runtime image
      # is distroless and carries no coreutils. That absence is the point of
      # the image, so the check adapts to it rather than the image to the check.
      - name: Runs as non-root
        run: |
          uid="$(docker run --rm --entrypoint python dsar-assist:ci -c 'import os; print(os.getuid())')"
          [ "$uid" = "10001" ] || { echo "expected uid 10001, got $uid"; exit 1; }

      # Distroless is not a claim to make without checking. A shell reachable
      # from the image is the whole surface this base was chosen to remove, and
      # a future edit that copies one in would otherwise go unnoticed.
      - name: No shell in the runtime image
        run: |
          for shell in /bin/sh /bin/bash /usr/bin/sh /usr/bin/bash; do
            if docker run --rm --entrypoint python dsar-assist:ci \
                 -c "import os,sys; sys.exit(0 if os.path.exists('$shell') else 1)"; then
              echo "$shell exists in the runtime image"
              exit 1
            fi
          done
          echo "no shell present"

      - name: Keyring dependency is absent from the image
        run: |
          out="$(docker run --rm --entrypoint python dsar-assist:ci -c \
            'import importlib.util; print(importlib.util.find_spec("msal_extensions"))')"
          [ "$out" = "None" ] || { echo "msal-extensions is present: $out"; exit 1; }

      # A runtime image with no package installer cannot fetch and install
      # code.
      #
      # Asked of the filesystem, not only of the import system. The venv never
      # had pip, so `find_spec` returned None and kept returning None while the
      # move to distroless quietly reintroduced pip 26.0 under /opt/python —
      # a python-build-standalone interpreter ships one. Trivy caught it; this
      # check had said nothing, because it was asking the wrong question.
      - name: No package installer in the runtime image
        run: |
          # One line. A multi-line -c program indented by the YAML block is
          # indented as far as Python is concerned too, and raises
          # IndentationError before it checks anything.
          out="$(docker run --rm --entrypoint python dsar-assist:ci -c 'import glob; roots = ("/opt/python", "/app", "/usr/local"); pats = ("pip", "pip3*", "ensurepip"); found = [p for r in roots for q in pats for p in glob.glob(r + "/**/" + q, recursive=True)]; print(chr(10).join(found) or "0")')"
          [ "$out" = "0" ] || { echo "a package installer is present:"; echo "$out"; exit 1; }
          out="$(docker run --rm --entrypoint python dsar-assist:ci -c \
            'import importlib.util; print(importlib.util.find_spec("pip"))')"
          [ "$out" = "None" ] || { echo "pip is importable in the runtime image"; exit 1; }

      - name: Doctor passes offline
        run: |
          docker run --rm \
            -e DSAR_CLIENT_ID=00000000-0000-0000-0000-000000000001 \
            -e DSAR_TENANT_ID=00000000-0000-0000-0000-000000000002 \
            dsar-assist:ci doctor --offline

      - name: Serves, with the security headers, on loopback only
        run: |
          # Same hardening flags the launchers pass, so CI proves the image
          # actually runs under them rather than only that it runs.
          docker run -d --rm --name dsar-ci -p 127.0.0.1:8765:8765 \
            --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,size=64m \
            --security-opt no-new-privileges \
            --cap-drop ALL \
            -e DSAR_CLIENT_ID=00000000-0000-0000-0000-000000000001 \
            -e DSAR_TENANT_ID=00000000-0000-0000-0000-000000000002 \
            dsar-assist:ci up --no-browser
          for _ in $(seq 1 30); do
            curl -sf http://127.0.0.1:8765/healthz >/dev/null && break
            sleep 1
          done
          curl -sf http://127.0.0.1:8765/healthz
          headers="$(curl -sD- -o /dev/null http://127.0.0.1:8765/)"
          echo "$headers" | grep -q "default-src 'none'"       || { echo "CSP missing"; exit 1; }
          echo "$headers" | grep -qi 'x-frame-options: DENY'    || { echo "XFO missing"; exit 1; }
          echo "$headers" | grep -qi 'x-content-type-options'   || { echo "nosniff missing"; exit 1; }
          # A path nobody named in the allowlist is not served. Deliberately a
          # name that could never become a real asset: this assertion is also
          # made by the test suite, and when /style.css BECAME a legitimate
          # asset the pytest twin was updated and this copy was not — four
          # commits went red before anyone looked. Duplicating an assertion
          # across two languages is how that happens; the least this copy can
          # do is use a path that will never legitimately exist.
          code="$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8765/not-an-asset-ever.txt)"
          [ "$code" = "404" ] || { echo "unlisted static returned $code"; exit 1; }
          # Path traversal out of the allowlist must not resolve either.
          code="$(curl -s -o /dev/null -w '%{http_code}' --path-as-is http://127.0.0.1:8765/../pyproject.toml)"
          [ "$code" = "404" ] || { echo "traversal returned $code"; exit 1; }
          docker port dsar-ci | grep -q '127.0.0.1:8765' || { echo "not loopback-only"; exit 1; }
          # Headers added because Phase 1 introduces an identity-provider redirect.
          echo "$headers" | grep -qi 'cross-origin-opener-policy: same-origin' \
            || { echo "COOP missing"; exit 1; }
          # The root filesystem must genuinely be read-only, not just requested.
          docker exec dsar-ci sh -c 'touch /app/pwned' 2>/dev/null \
            && { echo "root filesystem is writable"; exit 1; }
          docker stop -t 3 dsar-ci

      # Blocking: anything High or Critical that has a fix available.
      - name: Trivy — fixable vulnerabilities and secrets (blocking)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: dsar-assist:ci
          scanners: vuln,secret
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true

      # Non-blocking, but visible. `ignore-unfixed: true` alone means an
      # unfixable Critical in the base image is neither reported nor known
      # about, which is a worse position than knowing and deciding (WS10
      # SEC-L-04). Failing the build on something no patch exists for is not
      # the answer either, so this reports without blocking.
      - name: Trivy — unfixed vulnerabilities (report only)
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: dsar-assist:ci
          scanners: vuln
          severity: CRITICAL,HIGH
          exit-code: "0"
          ignore-unfixed: false

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    # On a pull_request event the action asks the API which commits the PR
    # contains, to work out the range to scan. The workflow default is
    # `contents: read` and nothing else, so that call was refused with
    # "Resource not accessible by integration" and took the job with it — on
    # every pull request, which so far has meant every Dependabot bump.
    #
    # Read, never write. This job checks out and runs against pull request
    # content; a token that could write to the pull request is a token that
    # content can reach.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Scan history, not only the tip. The design has no secret to leak,
          # which makes an accidental commit *more* likely to go unnoticed
          # rather than less — there is no rotation process to trigger (WS10
          # SEC-M-05).
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
          # Off, because posting one needs `pull-requests: write` on a job that
          # runs pull request content. The finding is in the log and the job
          # still fails on it; a comment is a convenience, not the control.
          GITLEAKS_ENABLE_COMMENTS: "false"
