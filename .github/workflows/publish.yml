name: Publish

# The launcher's default image is ghcr.io/<owner>/dsar-assist:latest. Until
# something pushes it, `./dsar up` — the primary documented path — fails for
# anyone not running from source. This is what makes that reference real.
#
# Runs after CI passes on main, never in parallel with it: publishing an image
# whose tests have not run is how a broken artefact acquires a version number.

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build, sign and publish
    # Only on a green CI run. `workflow_run` fires on failure too.
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # Keyless signing: the identity is this workflow, attested by GitHub's
      # OIDC provider. No key to store, rotate or leak — which is the same
      # argument the application itself makes about client secrets.
      id-token: write
      attestations: write

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0

      - name: Sign in to the registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long
            type=ref,event=tag

      - name: Build and push
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          # arm64 is not optional — Apple Silicon is where the predecessor's
          # demo failed, and a laptop is the primary target.
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # An SBOM says what is in the image; provenance says how it was
          # built. Both are attached to the image rather than published
          # alongside it, so they cannot drift from what they describe.
          sbom: true
          provenance: mode=max

      # GitHub's attestation store refuses user-owned private repositories:
      #   "Failed to persist attestation: Feature not available for user-owned
      #    private repositories."
      # This repository is private by policy, so the step failed every run —
      # taking cosign signing and its verification down with it, because they
      # come after. The published `:latest` was therefore unsigned while the
      # workflow claimed to sign it.
      #
      # Skipped on a private repository rather than marked continue-on-error.
      # A security step allowed to fail quietly is how a Trivy scan came to be
      # recorded as passed without ever having run. A skip is visible in the
      # job list; a green tick over a failure is not.
      #
      # Little is lost: buildx already attaches an SBOM and SLSA provenance
      # (mode=max) to the image itself, and cosign signs the digest below. This
      # step adds a second copy in GitHub's store, not the only copy.
      - name: Attest provenance
        if: github.event.repository.private == false
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign the image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          # Signs the DIGEST, not a tag. A tag can be repointed; a digest is
          # the image. Signing `:latest` would sign whatever `latest` happens
          # to mean at verification time, which is not a signature.
          cosign sign --yes "ghcr.io/${{ github.repository }}@${DIGEST}"

      - name: Verify what we just signed
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          # A signing step that is never verified is a step nobody would notice
          # breaking. This proves the signature exists and names the workflow
          # that made it.
          cosign verify \
            --certificate-identity-regexp "^https://github.com/${{ github.repository }}/" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "ghcr.io/${{ github.repository }}@${DIGEST}" > /dev/null
          echo "Signed and verified: ghcr.io/${{ github.repository }}@${DIGEST}"

      - name: Summary
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            echo "### Published"
            echo
            echo '```'
            echo "ghcr.io/${{ github.repository }}@${DIGEST}"
            echo '```'
            echo
            echo "Multi-arch (amd64, arm64), SBOM and provenance attached, signed keylessly."
            echo
            echo "Verify it:"
            echo '```bash'
            echo "cosign verify \\"
            echo "  --certificate-identity-regexp '^https://github.com/${{ github.repository }}/' \\"
            echo "  --certificate-oidc-issuer https://token.actions.githubusercontent.com \\"
            echo "  ghcr.io/${{ github.repository }}@${DIGEST}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
